name: Sync puertas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
      timezone: "Europe/Madrid"
    - cron: "30 7 * * *"
      timezone: "Europe/Madrid"
    - cron: "30 12 * * *"
      timezone: "Europe/Madrid"
    - cron: "45 14 * * *"
      timezone: "Europe/Madrid"

concurrency:
  group: sync-puertas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-puertas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync puertas
        id: sync
        continue-on-error: true
        env:
          CPE_PUERTAS_URL: "https://portal.cpevalencia.com/Noray/Puertas.asp?mode=GWT&devType=Desktop&device=Desktop&browser=Chrome&os=Windows&rd=316781698261120260630144003"
        run: npm run sync:puertas

      - name: Sync chapero
        id: sync_chapero
        continue-on-error: true
        env:
          CPE_SUPABASE_URL: ${{ secrets.CPE_SUPABASE_URL }}
          CPE_SUPABASE_SERVICE_ROLE: ${{ secrets.CPE_SUPABASE_SERVICE_ROLE }}
          CPE_CHAPERO_URL: "https://portal.cpevalencia.com/Noray/Chapero.asp?mode=GWT&devType=Desktop&device=Desktop&browser=Chrome&os=Windows&rd=744375419261120260702080606"
        run: npm run sync:chapero

      - name: Push snapshot to Supabase
        id: push_supabase
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          CPE_SUPABASE_URL: ${{ secrets.CPE_SUPABASE_URL }}
          CPE_SUPABASE_SERVICE_ROLE: ${{ secrets.CPE_SUPABASE_SERVICE_ROLE }}
        run: npm run push:supabase

      - name: Upload debug data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puertas-debug
          path: |
            data/raw-puertas.txt
            data/puertas-conductor-1a.json
            data/puertas-snapshots.json
            data/chapero-snapshot.json
            data/puertas-error.png
            data/chapero-error.png
          if-no-files-found: ignore

      - name: Report non-blocking errors
        if: steps.sync.outcome == 'failure' || steps.sync_chapero.outcome == 'failure' || steps.push_supabase.outcome == 'failure'
        run: |
          echo "::warning::Sync puertas/chapero no se completo, pero no se marca el workflow como fallido para evitar notificaciones por caidas externas."
