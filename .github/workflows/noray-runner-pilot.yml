name: Prueba Noray desde runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noray-runner-pilot
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Jornales access without exposing credentials
        env:
          CPE_NORAY_PILOT_72683_URL: ${{ secrets.CPE_NORAY_PILOT_72683_URL }}
          CPE_NORAY_PILOT_HEADED: "1"
        run: xvfb-run -a node scripts/probe-noray-runner.js
