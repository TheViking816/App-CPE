name: Sync portal oficial

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID temporal del job de portal"
        required: true

concurrency:
  group: sync-portal-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Sync portal
        # El proceso registra el resultado en Supabase para que la app lo muestre.
        # Un bloqueo temporal del portal no debe convertir el workflow en fallido
        # ni generar notificaciones por correo de GitHub Actions.
        continue-on-error: true
        env:
          CPE_SUPABASE_URL: ${{ secrets.CPE_SUPABASE_URL }}
          CPE_SUPABASE_SERVICE_ROLE: ${{ secrets.CPE_SUPABASE_SERVICE_ROLE }}
          CPE_PORTAL_SYNC_JOB_ID: ${{ github.event.inputs.job_id }}
          CPE_PORTAL_BROWSER_CHANNEL: bundled
          CPE_PORTAL_HEADLESS: "false"
        run: xvfb-run -a npm run sync:portal:job

      - name: Upload private portal diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-diagnostic-${{ github.run_id }}
          path: data/portal-oficial/messages-debug.png
          if-no-files-found: ignore
          retention-days: 1
