name: Sync portal oficial

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID temporal del job de portal"
        required: true

concurrency:
  group: sync-portal-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync portal
        env:
          CPE_SUPABASE_URL: ${{ secrets.CPE_SUPABASE_URL }}
          CPE_SUPABASE_SERVICE_ROLE: ${{ secrets.CPE_SUPABASE_SERVICE_ROLE }}
          CPE_PORTAL_SYNC_JOB_ID: ${{ github.event.inputs.job_id }}
          CPE_PORTAL_BROWSER_CHANNEL: chrome
          CPE_PORTAL_HEADLESS: "true"
        run: npm run sync:portal:job
